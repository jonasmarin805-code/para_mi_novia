<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz Día de las Flores Amarillas 🌻</title>
    
    <!-- Tailwind CSS para el diseño de la UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts para fuentes románticas y modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030306;
            font-family: 'Quicksand', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Pantalla de inicio (Splash Screen) */
        #splash-screen {
            background: radial-gradient(circle at center, rgba(20, 15, 5, 0.85) 0%, rgba(3, 3, 6, 0.98) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        /* Título Neón y Brillo */
        .glowing-title {
            font-family: 'Caveat', cursive;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.8), 
                         0 0 25px rgba(255, 200, 0, 0.5), 
                         0 0 40px rgba(255, 180, 0, 0.3);
        }

        .gold-glow-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gold-glow-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        /* Tarjeta Glassmorphic para Modal y Menús */
        .glass-card {
            background: rgba(18, 18, 24, 0.82);
            border: 1.5px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), 
                        0 0 25px rgba(255, 215, 0, 0.15),
                        inset 0 0 15px rgba(255, 215, 0, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .modal-text {
            font-family: 'Caveat', cursive;
            color: #FFFDE7;
            text-shadow: 0 0 10px rgba(255, 223, 0, 0.6);
        }

        /* Corazones animados al hacer click */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1.8s ease-out forwards;
            font-size: 1.5rem;
            z-index: 60;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
            }
            50% {
                transform: translate(calc(-50% + (var(--dx) * 1px)), calc(-50% - 60px)) scale(1.2) rotate(15deg);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + (var(--dx) * 2px)), calc(-50% - 130px)) scale(0.8) rotate(-15deg);
            }
        }

        /* Toast de notificación */
        #toast {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(100px);
            opacity: 0;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Contenedor del mundo 3D -->
    <div id="canvas-container"></div>

    <!-- 1. Pantalla de Inicio (Splash Screen) -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 text-center select-none">
        <div class="max-w-md w-full glass-card p-8 md:p-10 rounded-3xl flex flex-col items-center animate-fade-in">
            <!-- Icono Decorativo -->
            <div class="text-6xl mb-4 animate-pulse">🌻</div>
            
            <h2 class="text-4xl md:text-5xl font-bold text-yellow-300 glowing-title mb-3 leading-tight">
                Para la persona más especial 🌻
            </h2>
            
            <p class="text-yellow-100/80 text-base md:text-lg mb-8 font-medium">
                Un pequeño universo creado especialmente para iluminar tu día con amor y flores amarillas ✨
            </p>
            
            <button id="start-btn" class="gold-glow-btn text-black font-bold text-lg md:text-xl px-8 py-4 rounded-full w-full max-w-xs flex items-center justify-center gap-2">
                <span>Descubrir nuestra sorpresa</span>
                <span class="text-xl">✨</span>
            </button>
        </div>
    </div>

    <!-- Header Flotante con Título Neón (Aparece tras iniciar) -->
    <header id="main-header" class="fixed top-0 left-0 w-full z-20 p-4 md:p-6 text-center select-none opacity-0 transition-opacity duration-1000 pointer-events-none">
        <h1 class="text-3xl md:text-5xl text-yellow-300 font-bold glowing-title">
            Feliz día de las Flores Amarillas 🌻
        </h1>
        <p class="text-yellow-100/80 text-xs md:text-sm mt-2 font-medium bg-black/40 backdrop-blur-md inline-block px-4 py-1.5 rounded-full border border-yellow-500/30">
            Gira el universo y toca los mensajes 💛
        </p>
    </header>

    <!-- Botón Flotante para Personalizar la Foto del Planeta -->
    <div id="control-bar" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 opacity-0 transition-opacity duration-1000">
        <label for="photo-input" class="glass-card text-yellow-300 hover:text-yellow-200 font-semibold text-xs md:text-sm px-5 py-3 rounded-full cursor-pointer flex items-center gap-2 shadow-lg active:scale-95 transition-transform">
            <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>📷 Cambiar foto del planeta</span>
        </label>
        <input type="file" id="photo-input" accept="image/*" class="hidden">
    </div>

    <!-- Modal Romántico para Leer el Mensaje -->
    <div id="message-modal" class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/70 opacity-0 pointer-events-none transition-all duration-300 backdrop-blur-sm">
        <div class="glass-card w-full max-w-sm md:max-w-md rounded-3xl p-6 md:p-8 relative flex flex-col items-center text-center transform scale-90 transition-transform duration-300" id="modal-card">
            
            <!-- Decoraciones -->
            <div class="text-5xl md:text-6xl mb-3 animate-bounce">🌻</div>
            
            <h3 class="text-yellow-400 text-sm tracking-widest uppercase font-bold mb-2">Mensaje Especial</h3>
            
            <!-- Contenido del Mensaje -->
            <p id="modal-text-content" class="modal-text text-2xl md:text-3xl mb-6 leading-snug">
                <!-- Se llena dinámicamente -->
            </p>
            
            <!-- Botón para cerrar -->
            <button id="close-modal-btn" class="gold-glow-btn text-black font-bold text-base md:text-lg px-8 py-3 rounded-full w-full">
                Guardar en mi corazón 💛
            </button>
        </div>
    </div>

    <!-- Toast de Notificación -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 glass-card text-yellow-200 text-xs md:text-sm px-6 py-2.5 rounded-full flex items-center gap-2 shadow-2xl">
        <span id="toast-icon">✨</span>
        <span id="toast-msg">¡Foto actualizada con éxito!</span>
    </div>

    <!-- Three.js Library (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls para interacción 3D -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // DOM Elements
        const splashScreen = document.getElementById('splash-screen');
        const startBtn = document.getElementById('start-btn');
        const mainHeader = document.getElementById('main-header');
        const controlBar = document.getElementById('control-bar');
        const messageModal = document.getElementById('message-modal');
        const modalCard = document.getElementById('modal-card');
        const modalTextContent = document.getElementById('modal-text-content');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const photoInput = document.getElementById('photo-input');
        const toast = document.getElementById('toast');

        // Variables Globales Three.js
        let scene, camera, renderer, controls;
        let planetMesh, ringsMesh, messagesGroup;
        let raycaster, mouse;
        const interactiveSprites = [];

        // Base de Datos de Mensajes Románticos
        const messagesData = [
            { short: "Para ti 💛", full: "Cada segundo a tu lado es un regalo hermoso que atesoro para siempre." },
            { short: "Mi flor favorita 🌻", full: "De todas las flores en este universo, tú eres la más radiante y hermosa." },
            { short: "Pura alegría ✨", full: "Tu sonrisa tiene la magia de iluminar hasta mis días más oscuros." },
            { short: "Feliz día 🌻", full: "Espero que este pequeño detalle te recuerde lo inmensamente especial que eres." },
            { short: "Girasol hermoso 💛", full: "Así como los girasoles buscan al sol, mi corazón siempre te busca a ti." },
            { short: "Eres mi todo 🌟", full: "No imagino un solo día sin escuchar tu risa y tener tu compañía." },
            { short: "Te amo 💛", full: "Más allá de las palabras y de lo que cualquier universo pueda contener." },
            { short: "Brillas ✨", full: "Tienes un brillo único en el alma que me enamora cada día más." },
            { short: "Mi persona 💛", full: "Eres mi lugar seguro, mi paz y mi aventura favorita." },
            { short: "Mi corazón 💛", full: "Mi corazón te pertenece hoy, mañana y para toda la eternidad." },
            { short: "Atesoro tu amor 🌻", full: "Los momentos más felices de mi vida son los que escribo a tu lado." },
            { short: "Única ✨", full: "No existe nadie como tú. Eres una obra de arte perfecta." },
            { short: "Mi paz 🌟", full: "Un abrazo tuyo basta para reiniciar mi mundo y darme tranquilidad." },
            { short: "Eternamente 💛", full: "Quiero seguir coleccionando risas y recuerdos hermosos contigo siempre." },
            { short: "Magia pura ✨", full: "Lo nuestro es algo mágico, como un sueño del que nunca quiero despertar." },
            { short: "Eres mi luz 🌻", full: "Gracias por existir y por llenar mi vida de tanto color y calidez." },
            { short: "Te mereces todo 💛", full: "Te mereces el universo entero, todas las estrellas y cada flor que exista." },
            { short: "Mi reina 👑", full: "Haré todo lo posible por sacarte una sonrisa gigante cada único día." },
            { short: "Te admiro 🌟", full: "Admiro la mujer fuerte, hermosa y maravillosa que eres." },
            { short: "Siempre juntos 💛", full: "Prometo cuidar de ti y amarte con todo lo que soy." }
        ];

        // Genera una textura canvas por defecto para el planeta con tonos románticos
        function createDefaultPlanetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Fondo Degradado Espacial Cálido
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a0d00');
            gradient.addColorStop(0.3, '#4a2800');
            gradient.addColorStop(0.5, '#ffd700');
            gradient.addColorStop(0.7, '#8b5a00');
            gradient.addColorStop(1, '#0d0600');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Nubes doradas / nebulosa
            for (let i = 0; i < 80; i++) {
                ctx.fillStyle = `rgba(255, 215, 0, ${Math.random() * 0.15})`;
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 120 + 30, 0, Math.PI * 2);
                ctx.fill();
            }

            // Marcos y Corazones
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

            // Texto en el planeta
            ctx.font = 'bold 70px "Caveat", cursive, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 20;
            ctx.fillText('Nuestro Universo 💛', canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = '40px "Quicksand", sans-serif';
            ctx.fillText('Tú y Yo Siempre 🌻', canvas.width / 2, canvas.height / 2 + 50);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // Genera una textura degradada para los Anillos de Saturno
        function createRingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0.0, 'rgba(255, 215, 0, 0.0)');
            gradient.addColorStop(0.1, 'rgba(255, 223, 0, 0.8)');
            gradient.addColorStop(0.25, 'rgba(255, 180, 0, 0.3)');
            gradient.addColorStop(0.4, 'rgba(255, 235, 120, 0.95)');
            gradient.addColorStop(0.6, 'rgba(255, 215, 0, 0.5)');
            gradient.addColorStop(0.75, 'rgba(255, 255, 200, 0.85)');
            gradient.addColorStop(0.9, 'rgba(218, 165, 32, 0.4)');
            gradient.addColorStop(1.0, 'rgba(255, 215, 0, 0.0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function initThreeJS() {
            const container = document.getElementById('canvas-container');

            // 1. Escena
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030306, 0.0025);

            // 2. Cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 75);

            // 3. Renderizador optimizado para móvil
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Máximo DPR 2 para no sobrecalentar
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls con fluidez táctil
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.6;
            controls.enablePan = false;
            controls.minDistance = 22;
            controls.maxDistance = 130;
            controls.maxPolarAngle = Math.PI / 2 + 0.15; // Evita ver totalmente por debajo

            // Raycaster para interacciones táctiles
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Iluminación Cálida Romántica
            const ambientLight = new THREE.AmbientLight(0xfff5cc, 0.7);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffe57f, 1.8);
            mainLight.position.set(50, 40, 50);
            scene.add(mainLight);

            const fillLight = new THREE.PointLight(0xffa000, 2, 100);
            fillLight.position.set(-30, -10, -30);
            scene.add(fillLight);

            // Construir Elementos de la Escena
            createStarfield();
            createCentralPlanet();
            createSaturnRings();
            createFloatingMessages();

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('pointerdown', onPointerDown, false);
        }

        // Sistema de Estrellas Ligero (1 solo draw call)
        function createStarfield() {
            const starsCount = 3500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starsCount * 3);
            const colors = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 450;
                positions[i + 1] = (Math.random() - 0.5) * 450;
                positions[i + 2] = (Math.random() - 0.5) * 450;

                // Variación de colores (blanco, amarillo cálido, dorado)
                const tint = Math.random();
                colors[i] = 1.0;
                colors[i + 1] = 0.85 + tint * 0.15;
                colors[i + 2] = 0.5 + tint * 0.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.85,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });

            const starfield = new THREE.Points(geometry, material);
            scene.add(starfield);
        }

        // Planeta Central 3D
        function createCentralPlanet() {
            const geometry = new THREE.SphereGeometry(10, 64, 64);
            const defaultTexture = createDefaultPlanetTexture();

            const material = new THREE.MeshStandardMaterial({
                map: defaultTexture,
                roughness: 0.45,
                metalness: 0.1,
                bumpScale: 0.05
            });

            planetMesh = new THREE.Mesh(geometry, material);
            scene.add(planetMesh);

            // Resplandor del núcleo (Atmosférico)
            const glowGeo = new THREE.SphereGeometry(10.4, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffd700,
                transparent: true,
                opacity: 0.12,
                side: THREE.BackSide
            });
            const glowMesh = new THREE.Mesh(glowGeo, glowMat);
            planetMesh.add(glowMesh);
        }

        // Anillos 3D Estilo Saturno Elegantes
        function createSaturnRings() {
            const ringGeo = new THREE.RingGeometry(13.5, 24, 128);
            const ringTex = createRingTexture();

            // Corregir mapeo UV radial para el anillo
            const pos = ringGeo.attributes.position;
            const uv = ringGeo.attributes.uv;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const distance = Math.sqrt(x * x + y * y);
                const normalized = (distance - 13.5) / (24 - 13.5);
                uv.setXY(i, normalized, 0.5);
            }

            const ringMat = new THREE.MeshStandardMaterial({
                map: ringTex,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.88,
                roughness: 0.3,
                metalness: 0.2
            });

            ringsMesh = new THREE.Mesh(ringGeo, ringMat);
            
            // Inclinación elegante de los anillos
            ringsMesh.rotation.x = Math.PI / 2.2;
            ringsMesh.rotation.y = -Math.PI / 12;

            scene.add(ringsMesh);
        }

        // Crea los mensajes y girasoles alrededor del planeta
        function createFloatingMessages() {
            messagesGroup = new THREE.Group();
            scene.add(messagesGroup);

            // Duplicar datos para distribución rica en 360 grados
            const fullList = [...messagesData, ...messagesData];

            fullList.forEach((msg, idx) => {
                const isSunflowerOnly = idx % 5 === 0;
                const sprite = isSunflowerOnly 
                    ? createSunflowerSprite() 
                    : createTextSprite(msg.short, msg.full);

                // Distribuir en un disco/órbita (radio entre 30 y 85)
                const radius = 30 + Math.random() * 55;
                const theta = Math.random() * Math.PI * 2;
                
                const x = radius * Math.cos(theta);
                const z = radius * Math.sin(theta);
                const y = (Math.random() - 0.5) * 22;

                sprite.position.set(x, y, z);
                messagesGroup.add(sprite);
                interactiveSprites.push(sprite);
            });
        }

        // Sprite Canvas para Textos Románticos
        function createTextSprite(shortText, fullText) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            // Fondo pill semitransparente
            ctx.fillStyle = 'rgba(15, 12, 5, 0.75)';
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 4;
            
            // Dibujar rectángulo redondeado
            ctx.beginPath();
            ctx.roundRect(16, 16, canvas.width - 32, canvas.height - 32, 40);
            ctx.fill();
            ctx.stroke();

            // Sombra neón
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 38px "Quicksand", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.fillText(shortText, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;

            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false
            });

            const sprite = new THREE.Sprite(material);
            sprite.scale.set(14, 3.5, 1);
            sprite.userData = { fullMessage: fullText, isSunflower: false };

            return sprite;
        }

        // Sprite Canvas para Girasoles Flotantes
        function createSunflowerSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.font = '80px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 15;
            ctx.fillText('🌻', canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false
            });

            const sprite = new THREE.Sprite(material);
            sprite.scale.set(6, 6, 1);
            sprite.userData = { 
                fullMessage: "Un girasol brillante para ilumina tu camino siempre 🌻✨", 
                isSunflower: true 
            };

            return sprite;
        }

        // Detección de toques / clics en objetos 3D
        function onPointerDown(event) {
            // Descartar si el modal o splash están visibles
            if (splashScreen.style.display !== 'none' || messageModal.classList.contains('pointer-events-auto')) return;

            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveSprites);

            if (intersects.length > 0) {
                const hitSprite = intersects[0].object;
                const msg = hitSprite.userData.fullMessage;

                // Efecto de corazones visuales en el punto tocado
                spawnHeartEffect(clientX, clientY);

                // Abrir modal con mensaje
                openModal(msg);

                // Animación feedback del sprite
                const prevScaleX = hitSprite.scale.x;
                const prevScaleY = hitSprite.scale.y;
                hitSprite.scale.set(prevScaleX * 1.25, prevScaleY * 1.25, 1);
                setTimeout(() => {
                    hitSprite.scale.set(prevScaleX, prevScaleY, 1);
                }, 200);
            }
        }

        // Animación de Corazones Flotantes en Toque
        function spawnHeartEffect(x, y) {
            const icons = ['💛', '🌻', '✨', '💖'];
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerText = icons[Math.floor(Math.random() * icons.length)];
                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;
                heart.style.setProperty('--dx', (Math.random() - 0.5) * 80);
                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 1800);
            }
        }

        // Abrir Modal
        function openModal(text) {
            modalTextContent.innerText = text;
            messageModal.classList.remove('opacity-0', 'pointer-events-none');
            messageModal.classList.add('pointer-events-auto', 'opacity-100');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');
            controls.autoRotate = false;
        }

        // Cerrar Modal
        function closeModal() {
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            messageModal.classList.remove('opacity-100', 'pointer-events-auto');
            messageModal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                controls.autoRotate = true;
            }, 300);
        }

        closeModalBtn.addEventListener('click', closeModal);

        // Cargar foto personalizada para la textura del planeta
        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const texture = new THREE.CanvasTexture(img);
                        texture.needsUpdate = true;
                        planetMesh.material.map = texture;
                        planetMesh.material.needsUpdate = true;

                        showToast("¡Foto de ustedes cargada con éxito! 💛");
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Mostrar Toast
        function showToast(message) {
            document.getElementById('toast-msg').innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // Iniciar Experiencia al Presionar Botón
        startBtn.addEventListener('click', () => {
            splashScreen.style.opacity = '0';
            setTimeout(() => {
                splashScreen.style.display = 'none';
                mainHeader.classList.remove('opacity-0');
                controlBar.classList.remove('opacity-0');
            }, 800);
        });

        // Redimensionado Responsivo
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Loop Principal de Animación
        function animate(time) {
            requestAnimationFrame(animate);

            const t = time * 0.001;

            // Rotaciones continuas suaves
            if (planetMesh) {
                planetMesh.rotation.y += 0.002;
            }

            if (ringsMesh) {
                ringsMesh.rotation.z += 0.0005;
            }

            if (messagesGroup) {
                messagesGroup.rotation.y += 0.0008;

                // Estilmulo de flotación sinusoidal
                interactiveSprites.forEach((sprite, idx) => {
                    sprite.position.y += Math.sin(t * 1.5 + idx) * 0.015;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Inicializar al cargar ventana
        window.onload = function() {
            initThreeJS();
            animate(0);
        };
    </script>
</body>
</html>
